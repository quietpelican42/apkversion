[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apkversion"
version = "0.1.0"
description = "Alpine Linux (apk) package version validation, ordering and dependency constraint matching in pure Python."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "kofiadeyemiq"}]
keywords = ["alpine", "apk", "version", "compare", "semver"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/quietpelican42/apkversion"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apkversion = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
